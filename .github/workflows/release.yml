name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  version:
    needs: ci
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ${{ vars.RUNS_ON || 'house' }}
    steps:
      # The branch tip, not the pushed commit: a run queued behind another
      # release must see that release's version commit and tags.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - id: release
        uses: dsswift/release-damnit@v1.7.0
        with:
          since-last-release: 'true'
          publish: 'true'

